# 开发用：imgproxy + 容器内 cargo leptos watch（改代码自动重编）。
# 不要和默认 docker-compose.yml 抢 PIC_HOST_PORT；先停生产栈。
# 变量来自项目根目录 .env（先 cp example.env .env，改 PIC_DIR）。
#
#   podman compose down
#   cp example.env .env
#   podman compose -f dev.docker-compose.yml up --build
#   浏览器 http://127.0.0.1:${PIC_HOST_PORT:-3020}
#
# 第一次会编工具链镜像并完整编译项目，之后 crates / target 缓存在仓库的 .dev-cache/ 里。
# PIC_ROOT（容器内 /data）必须和 imgproxy 挂的是同一棵树。

name: pic-viewer-dev

services:
  imgproxy:
    image: docker.io/darthsim/imgproxy:v3.27.2
    container_name: pic-viewer-imgproxy-dev
    environment:
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /data
      IMGPROXY_BIND: 0.0.0.0:8080
      IMGPROXY_TTL: "31536000"
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_MAX_SRC_RESOLUTION: "50"
      IMGPROXY_MAX_SRC_FILE_SIZE: "104857600"
    volumes:
      - ${PIC_DIR:-./test/pic}:/data:ro,Z
    ports:
      - "${IMGPROXY_HOST_PORT:-8080}:8080"
    user: "1000:1000"
    userns_mode: keep-id
    restart: "no"

  pic-viewer:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: localhost/pic-viewer-dev:local
    container_name: pic-viewer-dev
    depends_on:
      - imgproxy
    working_dir: /app
    command: ["cargo", "leptos", "watch"]
    init: true
    tty: true
    stdin_open: true
    environment:
      PIC_ROOT: /data
      IMGPROXY_URL: http://imgproxy:8080
      LEPTOS_SITE_ADDR: 0.0.0.0:3020
      LEPTOS_RELOAD_PORT: "${LEPTOS_RELOAD_PORT:-3021}"
      CARGO_HOME: /cache/cargo
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: /app/target
    volumes:
      - .:/app:Z
      - ./.dev-cache/cargo:/cache/cargo:Z
      - ./.dev-cache/target:/app/target:Z
      - ${PIC_DIR:-./test/pic}:/data:Z
    ports:
      - "${PIC_HOST_PORT:-3020}:3020"
      - "${LEPTOS_RELOAD_PORT:-3021}:${LEPTOS_RELOAD_PORT:-3021}"
    userns_mode: keep-id
    restart: "no"
