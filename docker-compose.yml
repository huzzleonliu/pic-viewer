# 生产 / 给别人用的部署清单（默认文件名，直接 `podman compose up -d`）。
# 只拉现成镜像，不在本机编译。相册目录用 PIC_DIR，默认仓库里的测试图。
#
#   podman compose up -d
#   浏览器 http://127.0.0.1:3020
#
# 换成自己的相册：
#   PIC_DIR=/path/to/photos podman compose up -d
#
# 指定应用镜像：
#   PIC_VIEWER_IMAGE=ghcr.io/huzzleonliu/pic-viewer:v0.0.1 podman compose up -d
#
# 开发热更新请用：podman compose -f dev.docker-compose.yml up --build

name: pic-viewer

services:
  imgproxy:
    image: docker.io/darthsim/imgproxy:v3.27.2
    container_name: pic-viewer-imgproxy
    environment:
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /data
      IMGPROXY_BIND: 0.0.0.0:8080
      IMGPROXY_TTL: "31536000"
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_MAX_SRC_RESOLUTION: "50"
      IMGPROXY_MAX_SRC_FILE_SIZE: "104857600"
    volumes:
      - ${PIC_DIR:-./test/pic}:/data:ro,Z
    user: "1000:1000"
    userns_mode: keep-id
    expose:
      - "8080"
    restart: unless-stopped

  pic-viewer:
    image: ${PIC_VIEWER_IMAGE:-ghcr.io/huzzleonliu/pic-viewer:latest}
    container_name: pic-viewer
    depends_on:
      - imgproxy
    ports:
      - "3020:3000"
    environment:
      PIC_ROOT: /data
      IMGPROXY_URL: http://imgproxy:8080
      LEPTOS_SITE_ADDR: 0.0.0.0:3000
      LEPTOS_SITE_ROOT: /app/site
      LEPTOS_OUTPUT_NAME: pic-viewer
      LEPTOS_SITE_PKG_DIR: pkg
    volumes:
      - ${PIC_DIR:-./test/pic}:/data:Z
    userns_mode: keep-id
    restart: unless-stopped
